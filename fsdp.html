<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>FSDP 显存建模</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light only;
      --bg: #eaf1ed;
      --card: rgba(255, 255, 255, 0.82);
      --line: #d3e0d8;
      --text: #15241e;
      --muted: #5e7068;
      --accent: #1f6b56;
      --ok: #0f7a45;
      --warn: #9a5b00;
      --bad: #c43d3d;
      --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      --sans: Inter, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --shadow: 0 10px 30px rgba(21, 36, 30, 0.06);
      --c-w: #3b5bcc;
      --c-g: #7c6bc4;
      --c-o: #2a9d8f;
      --c-a: #d4a017;
      --c-d: #e76f51;
      --c-h: #4a90a4;
      --c-f: #9aa5ab;
      --c-p: #6c8ead;
      --c-os: #5c6b73;
      --c-pile: #c47c9a;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #dfeae4; }
    body {
      margin: 0; min-height: 100%; color: var(--text);
      font: 16px/1.55 var(--sans);
      background:
        radial-gradient(920px 460px at 8% -12%, rgba(47, 140, 110, 0.22), transparent 58%),
        radial-gradient(720px 420px at 96% 4%, rgba(59, 91, 204, 0.12), transparent 52%),
        linear-gradient(168deg, #e7f2ec 0%, #eef3f6 46%, #f4efe6 100%);
    }
    header {
      background: rgba(255, 255, 255, 0.58);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(211, 224, 216, 0.85);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto; padding: 18px 22px 20px;
    }
    header a.home {
      color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600;
      letter-spacing: .06em; display: inline-block; margin-bottom: 8px;
    }
    header a.home:hover { color: var(--accent); }
    header h1 {
      margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.15;
    }
    header p {
      margin: 8px 0 0; font-size: 15px; color: var(--muted); max-width: 46em; line-height: 1.55;
    }
    .app {
      display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 18px;
      max-width: 1280px; margin: 0 auto; padding: 20px 22px 56px; align-items: start;
    }
    .side, .main { display: grid; gap: 14px; }
    .side { position: sticky; top: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 18px 18px 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .kicker {
      margin: 0 0 12px; font: 600 11px/1 var(--mono); letter-spacing: .18em;
      text-transform: uppercase; color: var(--accent);
    }
    h3.sec { margin: 0 0 12px; font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
    .drop {
      border: 1px dashed #b7c8bf; border-radius: 10px; padding: 14px 10px;
      text-align: center; color: var(--muted); background: #f7faf8; cursor: pointer;
    }
    .drop.over, .drop:hover { border-color: var(--accent); background: #eef6f2; }
    .drop strong { color: var(--text); display: block; margin-bottom: 4px; }
    .drop .fn { color: var(--ok); font-size: 13px; margin-top: 6px; word-break: break-all; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 10px; padding: 8px 14px; cursor: pointer; font: 600 14px var(--sans);
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .chip {
      font-size: 12px; font-weight: 600; background: #eef2f0; color: #3d4d46;
      border-radius: 99px; padding: 4px 10px;
    }
    .chip.ok { background: #e4f5ea; color: var(--ok); }
    .chip.warn { background: #fff1d6; color: var(--warn); }
    .err { color: var(--bad); font-size: 13px; min-height: 1.1em; margin-top: 8px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .fields.one { grid-template-columns: 1fr; }
    label.f { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
    label.chk { font-size: 15px; color: var(--text); display: flex; align-items: center; gap: 9px; }
    .hint { font-size: 12.5px; font-weight: 500; color: #7a8982; line-height: 1.45; }
    input[type=number], input[type=text], select {
      width: 100%; height: 40px; font: 500 14px/1.2 var(--mono); padding: 8px 11px;
      border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.92); color: var(--text);
    }
    input[type=text] { font-family: var(--sans); letter-spacing: 0; }
    input:focus, select:focus {
      outline: none; border-color: #5ea089;
      box-shadow: 0 0 0 3px rgba(31, 107, 86, 0.14);
    }
    .checks { display: grid; gap: 10px; margin-top: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    .hero .lab {
      font: 600 12px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    }
    .hero .num {
      font: 700 56px/1.05 var(--mono); letter-spacing: -0.05em; margin: 10px 0 6px;
    }
    .hero .num span { font-size: 20px; font-weight: 500; color: var(--muted); margin-left: 8px; }
    .blocks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .blk {
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(247,251,249,.75));
    }
    .blk .n { font: 600 12px/1.3 var(--sans); color: var(--muted); }
    .blk .v { font: 650 18px/1.2 var(--mono); margin-top: 6px; }
    .blk .p { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .bar { height: 14px; background: #e3ece7; border-radius: 99px; overflow: hidden; display: flex; margin: 6px 0 10px; }
    .bar > i { display: block; height: 100%; }
    .map h2 { margin: 0 0 14px; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
    .part { border-top: 1px solid var(--line); padding: 14px 0; }
    .part:first-of-type { border-top: 0; padding-top: 0; }
    .part-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 16px; }
    .part-h b { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
    .part-h .g { font: 650 16px var(--mono); }
    .eq {
      margin: 10px 0 0; padding: 10px 12px; border-radius: 10px;
      background: #f3f7f5; border: 1px solid #e1eae5;
      font: 600 14px/1.5 var(--mono); color: #1b2420;
      white-space: nowrap; overflow-x: auto;
    }
    .sub { margin: 8px 0 0; padding: 0; list-style: none; }
    .sub li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 7px 0; font-size: 14px; }
    .sub .fml { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .sub .sv { font-family: var(--mono); }
    .tree { margin: 4px 0 0; }
    .tree details { border-top: 1px solid #e8eeea; }
    .tree > details:first-child { border-top: 0; }
    .tree summary { display: block; cursor: pointer; list-style: none; padding: 0; }
    .tree summary::-webkit-details-marker, .tree summary::marker { display: none; content: ""; }
    .tree .sum {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px;
      align-items: start; padding: 8px 0;
    }
    .tree summary .nm::before {
      content: "▸"; display: inline-block; width: 1.15em;
      color: var(--accent); font-size: 12px;
    }
    .tree details[open] > summary .nm::before { content: "▾"; }
    .tree summary:hover .nm { color: var(--accent); }
    .tree .kids { padding-left: 16px; }
    .tree .kids .sub { margin: 0; }
    .tree .leaf {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px;
      padding: 7px 0 7px 1.15em; border-top: 1px solid #e8eeea; font-size: 14px;
    }
    .tree .nm { font-size: 14px; font-weight: 500; }
    .tree .fml { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .tree .sv { font-family: var(--mono); font-size: 14px; white-space: nowrap; }
    .note { margin: 10px 0 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
    .nline {
      margin: 8px 0 0;
      font: 600 13px/1.5 var(--mono); color: #1b2420;
      white-space: nowrap; overflow-x: auto;
    }
    .foot { font-size: 13px; color: var(--muted); margin-top: 10px; }
    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .side { position: static; }
      .blocks { grid-template-columns: 1fr 1fr; }
      .hero .num { font-size: 40px; }
      header h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="home" href="./">← QWEN 小工具</a>
      <h1>FSDP 显存建模</h1>
    </div>
  </header>

  <div class="app">
    <aside class="side">
      <section class="card">
        <p class="kicker">Configuration</p>
        <label class="f">模型
          <select id="ovModel"></select>
        </label>
        <label class="f" style="margin-top:10px;">自定义 ModelScope 仓库
          <span class="hint">任意 owner/name，回车拉取。</span>
          <input id="ovCustomRepo" type="text" placeholder="Qwen/Qwen3.5-9B" autocomplete="off" />
        </label>
        <div class="muted" id="cfgHint" style="margin-top:8px;">权重数据实时从 ModelScope 拉取。</div>
        <div class="chips" id="chips"></div>
        <div class="err" id="err"></div>
      </section>

      <section class="card">
        <h3 class="sec">切分配置</h3>
        <div class="fields">
          <label class="f">FSDP 卡数 P<input id="ovP" type="number" min="0" step="1" /></label>
          <label class="f">单卡容量 GiB<input id="ovHbm" type="number" min="0" step="1" /></label>
          <label class="f" id="wrapField">Wrap 粒度
            <select id="ovWrap">
              <option value="0">嵌套（experts）</option>
              <option value="1">整层 layers.*</option>
            </select>
          </label>
          <label class="f">HCCL_BUFFSIZE MB<input id="ovHccl" type="number" min="0" step="1" /></label>
        </div>
        <p class="hint" id="splitHint" style="margin:8px 0 0;">param=bf16 · reduce=fp32 · AdamW · EP=1 · CP=1。静态 N/P×10（不含梯度）；梯度作动态并 ×2。</p>
      </section>

      <section class="card">
        <h3 class="sec">MTP 层</h3>
        <div class="fields one">
          <label class="f">MTP 层数<span class="hint">训练常用 0</span>
            <input id="ovMtp" type="number" min="0" step="1" />
          </label>
        </div>
      </section>

      <section class="card">
        <h3 class="sec">训练数据</h3>
        <div class="fields">
          <label class="f">实际 seq<input id="ovSeq" type="number" min="0" step="1" /></label>
          <label class="f">micro_batch_size<input id="ovMbs" type="number" min="0" step="1" /></label>
          <label class="f">chunk_mbs<input id="ovChunk" type="number" min="0" step="1" /></label>
        </div>
        <p class="hint" style="margin:8px 0 0;">填真实 token 数，不要用 yaml 的 cutoff_len。chunk_mbs&gt;0 时 B_fwd 取该值。</p>
      </section>

      <section class="card">
        <h3 class="sec">显存优化</h3>
        <label class="f">prefetch<span class="hint" id="prefetchHint">计算本层时预取后续层，每 +1 增加 1×U</span>
          <input id="ovPrefetch" type="number" min="0" step="1" />
        </label>
        <div class="checks">
          <label class="chk"><input id="ovRecompute" type="checkbox" /> recompute 层激活</label>
          <label class="chk"><input id="ovOffload" type="checkbox" /> activation offload</label>
          <label class="chk"><input id="ovSkipGdn" type="checkbox" /> skip_gdn_recompute</label>
          <label class="chk" id="gmmRow"><input id="ovGmm" type="checkbox" /> grouped expert matmul</label>
          <label class="chk"><input id="ovFreeze" type="checkbox" /> 冻结 ViT</label>
        </div>
      </section>
    </aside>

    <main class="main">
      <section class="card hero">
        <div class="lab">Estimated per device</div>
        <div class="num" id="vTotal">—<span>GiB</span></div>
        <div class="muted" id="vTotalSub">npu-smi Used 口径</div>
        <div class="bar" id="hbmBar" style="margin-top:14px;"></div>
        <div class="muted" id="vRemain"></div>
      </section>

      <section class="card">
        <p class="kicker">Breakdown</p>
        <div class="blocks" id="blocks"></div>
      </section>

      <section class="card map">
        <p class="kicker">Memory map</p>
        <h2>显存构成</h2>
        <div id="mapBody"></div>
        <p class="foot" id="mapFoot"></p>
      </section>
    </main>
  </div>

<script>
const GIB = 1024 ** 3;
const MIB = 1024 ** 2;
const COLORS = {
  weight: "var(--c-w)", grad: "var(--c-g)", adam: "var(--c-o)", act: "var(--c-a)",
  dyn: "var(--c-d)", pile: "var(--c-pile)", hccl: "var(--c-h)", frag: "var(--c-f)",
  pta: "var(--c-p)", os: "var(--c-os)",
};

const DEFAULT_35B = {
  vocab: 248320, hidden: 2048, layers: 20, experts: 256, moeI: 512, shareI: 512, denseI: 0,
  nQ: 16, nKV: 2, headDim: 256, fullInterval: 4,
  gdnKH: 16, gdnKD: 128, gdnVH: 32, gdnVD: 128, gdnConv: 4, mtp: 0,
  vitDepth: 27, vitH: 1152, vitI: 4304, vitOut: 2048,
  patch: 16, tPatch: 2, inCh: 3, merge: 2, nPos: 2304,
  tie: false, attnGate: true, layerTypes: [],
  arch: "Qwen3_5MoeForConditionalGeneration",
  topk: 8,
};

const EMPTY_MODEL = {
  vocab: 0, hidden: 0, layers: 0, experts: 0, moeI: 0, shareI: 0, denseI: 0,
  nQ: 0, nKV: 0, headDim: 0, fullInterval: 4,
  gdnKH: 0, gdnKD: 0, gdnVH: 0, gdnVD: 0, gdnConv: 4, mtp: 0,
  vitDepth: 0, vitH: 0, vitI: 0, vitOut: 0,
  patch: 16, tPatch: 2, inCh: 3, merge: 2, nPos: 0,
  tie: false, attnGate: false, layerTypes: [],
  arch: "", topk: 8,
};

function defaultLayerTypes(L, iv) {
  return Array.from({ length: L }, (_, i) => ((i + 1) % iv === 0 ? "full_attention" : "linear_attention"));
}

function defaultTrainMoe() {
  return {
    P: 8, EP: 1, CP: 1, ring: 1, bw: 2, nAdam: 2, bAdam: 4, bReduce: 4,
    mbs: 4, seq: 512, chunk: 2, prefetch: 1, wrap: 0,
    freezeVisual: false, recompute: true, offload: true,
    skipGdn: true, gmm: true, hbm: 64, mtp: 0, hcclMB: 200,
    fragG: 1, ptaG: 1, osG: 3.5,
  };
}

function defaultTrainDense() {
  return {
    P: 8, EP: 1, CP: 1, ring: 1, bw: 2, nAdam: 2, bAdam: 4, bReduce: 4,
    mbs: 2, seq: 448, chunk: 0, prefetch: 1, wrap: 1,
    freezeVisual: false, recompute: true, offload: true,
    skipGdn: true, gmm: false, hbm: 64, mtp: 0, hcclMB: 200,
    fragG: 1, ptaG: 1, osG: 3.5,
  };
}

const QWEN_GROUPS = [
  {
    label: "Qwen3.8",
    models: ["Qwen3.8-27B", "Qwen3.8-2.4T-A95B"],
  },
  {
    label: "Qwen3.6",
    models: ["Qwen3.6-27B", "Qwen3.6-35B-A3B", "Qwen3.6-35B-A3B (20L)"],
  },
  {
    label: "Qwen3.5",
    models: [
      "Qwen3.5-0.8B", "Qwen3.5-2B", "Qwen3.5-4B", "Qwen3.5-9B", "Qwen3.5-27B",
      "Qwen3.5-35B-A3B", "Qwen3.5-122B-A10B", "Qwen3.5-397B-A17B",
    ],
  },
  {
    label: "Qwen3 VL",
    models: [
      "Qwen3-VL-8B-Instruct", "Qwen3-VL-32B-Instruct",
      "Qwen3-VL-30B-A3B-Instruct", "Qwen3-VL-235B-A22B-Instruct",
    ],
  },
  {
    label: "Qwen3",
    models: [
      "Qwen3-0.6B", "Qwen3-1.7B", "Qwen3-4B", "Qwen3-8B", "Qwen3-14B", "Qwen3-32B",
      "Qwen3-4B-Instruct", "Qwen3-8B-Instruct", "Qwen3-14B-Instruct", "Qwen3-32B-Instruct",
      "Qwen3-30B-A3B", "Qwen3-30B-A3B-Thinking-2507",
      "Qwen3-235B-A22B", "Qwen3-235B-A22B-Instruct-2507",
      "Qwen3-Next-80B-A3B-Instruct",
      "Qwen3-Coder-30B-A3B-Instruct", "Qwen3-Coder-480B-A35B-Instruct",
    ],
  },
  {
    label: "Qwen2.5 VL",
    models: ["Qwen2.5-VL-7B-Instruct", "Qwen2.5-VL-72B-Instruct"],
  },
];

function allQwenModels() {
  return QWEN_GROUPS.flatMap((g) => g.models);
}

function repoForModel(name) {
  return name === "Qwen3.6-35B-A3B (20L)" ? "local:20L" : "Qwen/" + name;
}

const S = {
  modelName: "Qwen3.5-27B",
  weightRepo: "Qwen/Qwen3.5-27B",
  model: { ...EMPTY_MODEL },
  train: defaultTrainDense(),
};

function $(id) { return document.getElementById(id); }
function pick(obj, keys, fb) {
  if (!obj) return fb;
  for (const k of keys) if (obj[k] != null) return obj[k];
  return fb;
}
function isNum(x) { return typeof x === "number" && Number.isFinite(x); }
function fmtG(x) {
  if (!isNum(x)) return "null";
  return (Math.round(x * 1000) / 1000).toFixed(3);
}
function fmtN(x) {
  if (!isNum(x)) return "null";
  return Math.round(x).toLocaleString("en-US");
}
function mem(x) { return isNum(x) ? fmtG(x) + " GiB" : "null"; }
function sumNum() {
  let s = 0;
  for (const x of arguments) {
    if (!isNum(x)) return null;
    s += x;
  }
  return s;
}
function readNum(id) {
  const raw = String($(id).value ?? "").trim();
  if (raw === "") return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}
function writeNum(id, v) { $(id).value = v == null ? "" : String(v); }
function pct(part, tot) {
  if (!isNum(part) || !isNum(tot) || tot === 0) return "null";
  return (part / tot * 100).toFixed(1) + "%";
}

function detectFamily(m) {
  const moe = (m.experts || 0) > 0;
  const vit = (m.vitDepth || 0) > 0;
  const gdn = (m.gdnKH || 0) > 0;
  if (moe && vit && gdn) return { id: "qwen35_moe_vl", label: "Qwen3.5/3.6 MoE 多模态" };
  if (!moe && vit && gdn) return { id: "qwen35_dense_vl", label: "Qwen3.5 Dense 多模态" };
  if (vit && !gdn) return { id: "qwen3_vl", label: "Qwen3-VL Dense" };
  if (moe && !vit) return { id: "qwen3_moe_text", label: "Qwen3 MoE 文本" };
  return { id: "qwen3_dense_text", label: "Qwen3 Dense 文本" };
}

function parseConfig(cfg) {
  const text = cfg.text_config || cfg.language_config || cfg;
  const vis = cfg.vision_config || {};
  const nQ = pick(text, ["num_attention_heads"], 0);
  const H = pick(text, ["hidden_size"], 0);
  return {
    vocab: pick(text, ["vocab_size"], 0),
    hidden: H,
    layers: pick(text, ["num_hidden_layers"], 0),
    experts: pick(text, ["num_experts", "num_local_experts"], 0),
    moeI: pick(text, ["moe_intermediate_size"], 0),
    shareI: pick(text, ["shared_expert_intermediate_size"], pick(text, ["moe_intermediate_size"], 0)),
    denseI: pick(text, ["intermediate_size"], 0),
    nQ,
    nKV: pick(text, ["num_key_value_heads"], 0),
    headDim: pick(text, ["head_dim"], 0) || (H && nQ ? H / nQ : 0),
    fullInterval: pick(text, ["full_attention_interval"], 4),
    gdnKH: pick(text, ["linear_num_key_heads"], 0),
    gdnKD: pick(text, ["linear_key_head_dim"], 0),
    gdnVH: pick(text, ["linear_num_value_heads"], 0),
    gdnVD: pick(text, ["linear_value_head_dim"], 0),
    gdnConv: pick(text, ["linear_conv_kernel_dim"], 4),
    mtp: pick(text, ["mtp_num_hidden_layers"], 0),
    tie: !!(cfg.tie_word_embeddings ?? text.tie_word_embeddings),
    attnGate: !!text.attn_output_gate,
    vitDepth: pick(vis, ["depth"], 0),
    vitH: pick(vis, ["hidden_size"], 0),
    vitI: pick(vis, ["intermediate_size"], 0),
    vitOut: pick(vis, ["out_hidden_size"], 0),
    patch: pick(vis, ["patch_size"], 16),
    tPatch: pick(vis, ["temporal_patch_size"], 2),
    inCh: pick(vis, ["in_channels"], 3),
    merge: pick(vis, ["spatial_merge_size"], 2),
    nPos: pick(vis, ["num_position_embeddings"], 0),
    layerTypes: text.layer_types || [],
    arch: (cfg.architectures || [cfg.model_type || ""]).join(", "),
    modelType: cfg.model_type || text.model_type || "",
    topk: pick(text, ["num_experts_per_tok"], 8) || 8,
  };
}

function compute(model, train) {
  const p = { ...model, ...train };
  const V = p.vocab, H = p.hidden, L = p.layers, E = p.experts, I = p.moeI;
  const P = p.P;
  const pOk = isNum(P) && P > 0;
  const EP = 1;
  const ulysses = 1;
  const ring = 1;
  const CP = 1;
  const bw = 2, bg = 2, nAdam = 2, bAdam = 4;
  const bReduce = 4;
  const reduceScale = 2;
  const mtp = isNum(p.mtp) ? Math.max(p.mtp, 0) : 0;
  const topk = Math.max(p.topk || 8, 1);
  const shareI = p.shareI || I;
  const warns = [];
  if (P == null) warns.push("P 为空，N/P、梯度无法计算");
  else if (P === 0) warns.push("P = 0，无法做 N/P 除法，相关项为 null");
  else if (P < 0) warns.push("P 为负数，N/P 相关项为 null");

  const embed = V * H;
  const lm = p.tie ? 0 : V * H;
  const finalNorm = H;
  let gateUp = 0, down = 0, router = 0, shared = 0, sharedGate = 0, denseMlp = 0;
  if (E > 0) {
    gateUp = E * H * 2 * I;
    down = E * I * H;
    router = E * H;
    shared = 3 * H * shareI;
    sharedGate = H;
  } else if (p.denseI > 0) {
    denseMlp = 3 * H * p.denseI;
  }
  const moeOther = router + shared + sharedGate;
  const mlpPer = gateUp + down + moeOther + denseMlp;

  const fullQ = H * p.nQ * p.headDim * (p.attnGate ? 2 : 1);
  const fullK = H * p.nKV * p.headDim;
  const fullV = H * p.nKV * p.headDim;
  const fullO = p.nQ * p.headDim * H;
  const fullQkNorm = 2 * p.headDim;
  const fullAttn = fullQ + fullK + fullV + fullO + fullQkNorm;
  const hasGdn = (p.gdnKH || 0) > 0;
  const dk = (p.gdnKH || 0) * (p.gdnKD || 0);
  const dv = (p.gdnVH || 0) * (p.gdnVD || 0);
  const gdn = hasGdn
    ? H * (2 * dk + 2 * dv + 2 * p.gdnVH)
      + dv * H
      + p.gdnConv * (2 * dk + dv)
      + 2 * p.gdnVH + p.gdnVD
    : 0;

  let nFull, nGdn;
  const types = (p.layerTypes || []).filter(Boolean);
  if (!hasGdn) { nFull = L; nGdn = 0; }
  else if (types.length === L) {
    nFull = types.filter((t) => String(t).includes("full")).length;
    nGdn = L - nFull;
  } else {
    nFull = p.fullInterval > 0 ? Math.floor(L / p.fullInterval) : 0;
    nGdn = L - nFull;
  }
  const attn = nFull * fullAttn + nGdn * gdn;
  const layerNorm = 2 * H;
  const mlpLayersN = L * (mlpPer + layerNorm);
  const mtpN = mtp * (mlpPer + layerNorm + (hasGdn ? (fullAttn + gdn) / 2 : fullAttn));
  const textN = embed + lm + finalNorm + attn + mlpLayersN + mtpN;

  let vitPatch = 0, vitBlock = 0, vitMerger = 0, vit = 0;
  if (p.vitDepth > 0 && p.vitH > 0) {
    const Hv = p.vitH, Iv = p.vitI, out = p.vitOut, sm = p.merge;
    vitPatch = p.inCh * p.tPatch * p.patch * p.patch * Hv + Hv;
    vitBlock = Hv * (Hv * 3) + (Hv * 3) + Hv * Hv + Hv + Hv * Iv + Iv + Iv * Hv + Hv + 2 * Hv;
    vitMerger = Hv + (Hv * sm * sm) ** 2 + (Hv * sm * sm) + (Hv * sm * sm) * out + out + p.nPos * Hv;
    if (!p.freezeVisual) vit = vitPatch + p.vitDepth * vitBlock + vitMerger;
  }

  const N = textN + vit;
  const nExpert = E > 0 ? (L + mtp) * (gateUp + down) : 0;
  const perCard = pOk ? N / P : null;
  const paramG = pOk ? perCard * bw / GIB : null;
  const gradBf16G = pOk ? perCard * bg / GIB : null;
  const gradG = pOk ? 2 * gradBf16G : null;
  const adamG = pOk ? perCard * nAdam * bAdam / GIB : null;
  const staticG = sumNum(paramG, adamG);

  const expertNumel = gateUp + down;
  const attnAvg = L ? (nFull * fullAttn + nGdn * gdn) / L : 0;
  const layerNumel = expertNumel + moeOther + attnAvg + 2 * H;
  const unitNumel = p.wrap ? layerNumel : (expertNumel || layerNumel);
  const Ufull = unitNumel * bw / GIB;
  const U = Ufull / EP;

  let prefetch = p.prefetch;
  let prefG;
  if (prefetch == null) {
    prefetch = 0;
    prefG = 0;
  } else if (prefetch < 0) {
    warns.push("prefetch 为负数，动态内存为 null");
    prefG = null;
  } else {
    prefG = prefetch * U;
  }
  const agG = U;
  const copyG = U;
  const reduceInG = U * reduceScale;
  const gmmG = (p.gmm && E > 0 && !p.wrap) ? U : 0;
  const dynG = sumNum(agG, copyG, prefG, reduceInG, gmmG);

  const seq = p.seq;
  const mbs = p.mbs;
  const chunk = p.chunk;
  let samplesFwd = null, seqLocal = null, tokens = null, hiddenG = null, skipG = 0, dispatchG = 0, actG = null;
  const liveLayers = (p.recompute || p.offload) ? 1 : Math.max(L, 1);
  if (seq == null) {
    warns.push("seq 为空，激活值为 null");
  } else if (seq < 0) {
    warns.push("seq 为负数，激活值为 null");
  } else {
    seqLocal = seq / CP;
    if (isNum(chunk) && chunk > 0) samplesFwd = chunk;
    else if (mbs == null) warns.push("micro_batch_size 为空且 chunk_mbs 未>0，激活值为 null");
    else if (mbs < 0) warns.push("micro_batch_size 为负数，激活值为 null");
    else samplesFwd = mbs;
    if (isNum(samplesFwd) && samplesFwd < 0) {
      warns.push("B_fwd 为负数，激活值为 null");
      samplesFwd = null;
    }
    if (isNum(samplesFwd)) {
      tokens = samplesFwd * seqLocal;
      hiddenG = tokens * H * 2 / GIB;
      if (p.skipGdn && nGdn > 0 && !p.offload) {
        const qkv = 2 * (p.gdnKH || 0) * (p.gdnKD || 0) + (p.gdnVH || 0) * (p.gdnVD || 0);
        skipG = nGdn * tokens * qkv * 2 / GIB;
      }
      if (EP > 1 && E > 0) dispatchG = tokens * topk * H * 2 / GIB;
      actG = liveLayers * hiddenG + skipG + dispatchG;
    }
  }

  const nComm = 1 + (EP > 1 ? 1 : 0) + (CP > 1 ? 1 : 0);
  const hcclMB = p.hcclMB;
  let hcclG = null;
  if (hcclMB == null) warns.push("HCCL_BUFFSIZE 为空，HCCL 为 null");
  else if (hcclMB < 0) warns.push("HCCL_BUFFSIZE 为负数，HCCL 为 null");
  else hcclG = nComm * hcclMB * 2 / 1024;
  const fragG = p.fragG, ptaG = p.ptaG, osG = p.osG;
  const peakG = sumNum(staticG, gradG, dynG, actG);
  const deviceG = sumNum(peakG, hcclG, fragG, ptaG, osG);

  if (isNum(P) && P % EP !== 0) warns.push("EDP=1 时 P 应能被 EP 整除（efsdp=P/EP）");
  if (p.nKV && ulysses > 1 && p.nKV % ulysses !== 0) warns.push("n_kv=" + p.nKV + " 不能被 Ulysses=" + ulysses + " 整除");
  if (isNum(seq) && seq % CP !== 0) warns.push("seq=" + seq + " 不能被 CP=" + CP + " 整除，collator 会要求 pad");

  return {
    N, P, EP, CP, ulysses, ring, perCard, paramG, gradBf16G, gradG, adamG, staticG,
    nFull, nGdn, U, Ufull, agG, copyG, prefG, reduceInG, gmmG, dynG,
    actG, skipG, dispatchG, hiddenG,
    hcclG, nComm, hcclMB, fragG, ptaG, osG, peakG, deviceG,
    nExpert, vit, L, H, V, E, I, mbs: p.mbs, seq, chunk: p.chunk, prefetch,
    samplesFwd, tokens, seqLocal, liveLayers, mtp, wrap: !!p.wrap, bw, bReduce, reduceScale,
    topk, warns, gateUp, down, expertNumel, unitNumel, moeOther, attnAvg,
    embed, lm, finalNorm, router, shared, sharedGate, denseMlp, mlpPer, mlpLayersN,
    fullAttn, gdn, attn, mtpN, textN, vitPatch, vitBlock, vitMerger, vitDepth: p.vitDepth || 0,
    shareI, denseI: p.denseI || 0, nQ: p.nQ, nKV: p.nKV, headDim: p.headDim,
    attnGate: !!p.attnGate, tie: !!p.tie, freezeVisual: !!p.freezeVisual,
    dk, dv, gdnKH: p.gdnKH || 0, gdnVH: p.gdnVH || 0, gdnConv: p.gdnConv || 0, gdnVD: p.gdnVD || 0,
    fullQ, fullK, fullV, fullO, fullQkNorm,
  };
}

function applyDenseScheme(r, model) {
  const isMoe = (model.experts || 0) > 0;
  r.isMoe = isMoe;
  r.denseScheme = null;
  r.uHeadG = null;
  if (isMoe) return r;
  const uHeadG = (model.vocab || 0) * (model.hidden || 0) * 2 / GIB;
  const dynA = r.dynG;
  const dynB = sumNum(uHeadG, 2 * uHeadG);
  const peakA = sumNum(r.staticG, r.gradG, dynA, r.actG);
  const peakB = sumNum(r.staticG, r.gradG, dynB, r.actG);
  const pickB = !isNum(peakA) || (isNum(peakB) && peakB >= peakA);
  r.uHeadG = uHeadG;
  r.denseScheme = pickB ? "B" : "A";
  if (pickB) {
    r.dynG = dynB;
    r.peakG = peakB;
    r.deviceG = sumNum(r.peakG, r.hcclG, r.fragG, r.ptaG, r.osG);
  }
  return r;
}

function readForm() {
  const t = S.train;
  t.P = readNum("ovP");
  t.EP = 1;
  t.CP = 1;
  t.ring = 1;
  t.wrap = Number($("ovWrap").value) ? 1 : 0;
  t.bReduce = 4;
  t.hbm = readNum("ovHbm");
  t.hcclMB = readNum("ovHccl");
  t.mtp = readNum("ovMtp");
  S.model.mtp = isNum(t.mtp) ? Math.max(t.mtp, 0) : 0;
  t.seq = readNum("ovSeq");
  t.mbs = readNum("ovMbs");
  t.chunk = readNum("ovChunk");
  t.prefetch = readNum("ovPrefetch");
  t.recompute = $("ovRecompute").checked;
  t.offload = $("ovOffload").checked;
  t.skipGdn = $("ovSkipGdn").checked;
  t.gmm = $("ovGmm").checked;
  t.freezeVisual = $("ovFreeze").checked;
}

function writeForm() {
  const t = S.train;
  $("ovModel").value = S.modelName;
  writeNum("ovP", t.P);
  $("ovWrap").value = String(t.wrap || 0);
  writeNum("ovHbm", t.hbm);
  writeNum("ovHccl", t.hcclMB);
  writeNum("ovMtp", t.mtp);
  writeNum("ovSeq", t.seq);
  writeNum("ovMbs", t.mbs);
  writeNum("ovChunk", t.chunk);
  writeNum("ovPrefetch", t.prefetch);
  $("ovRecompute").checked = !!t.recompute;
  $("ovOffload").checked = !!t.offload;
  $("ovSkipGdn").checked = !!t.skipGdn;
  $("ovGmm").checked = !!t.gmm;
  $("ovFreeze").checked = !!t.freezeVisual;
  syncTypeUi();
}

function syncTypeUi() {
  const moe = (S.model.experts || 0) > 0;
  $("wrapField").style.display = moe ? "" : "none";
  $("gmmRow").style.display = moe ? "" : "none";
  $("splitHint").textContent = moe
    ? "param=bf16 · reduce=fp32 · AdamW · EP=1 · CP=1。静态 N/P×10（不含梯度）；梯度作动态并 ×2；动态内存 6U；激活用完整 seq。"
    : "param=bf16 · reduce=fp32 · AdamW · EP=1 · CP=1。静态 N/P×10（不含梯度）；梯度作动态并 ×2，不单列分片。Dense 两套高峰取较大者展示。";
  $("prefetchHint").textContent = moe
    ? "计算本层时预取后续层，每 +1 增加 1×U"
    : "方案 A 每 +1 增加 1×U_层；方案 B 不加词表 prefetch。页面只展示较大高峰。";
}

function partsOf(r) {
  return [
    { id: "weight", name: "权重", g: r.paramG, color: COLORS.weight },
    { id: "adam", name: "优化器", g: r.adamG, color: COLORS.adam },
    { id: "grad", name: "梯度", g: r.gradG, color: COLORS.grad },
    { id: "dyn", name: "动态内存", g: r.dynG, color: COLORS.dyn },
    { id: "act", name: "激活值", g: r.actG, color: COLORS.act },
    { id: "hccl", name: "HCCL", g: r.hcclG, color: COLORS.hccl },
    { id: "frag", name: "内存碎片", g: r.fragG, color: COLORS.frag },
    { id: "pta", name: "PTA", g: r.ptaG, color: COLORS.pta },
    { id: "os", name: "Device OS", g: r.osG, color: COLORS.os },
  ];
}

function render() {
  const r = applyDenseScheme(compute(S.model, S.train), S.model);
  const parts = partsOf(r);
  const tot = r.deviceG;
  const hbm = S.train.hbm;

  $("vTotal").innerHTML = isNum(tot) ? fmtG(tot) + "<span>GiB</span>" : "null";
  $("vTotalSub").textContent = isNum(tot)
    ? "npu-smi Used 口径（含 HCCL / 碎片 / PTA / OS）"
    : "配置不完整或除数为 0，相关项为 null";
  if (!isNum(hbm)) $("vRemain").textContent = "单卡容量为空，余量无法计算";
  else if (!isNum(tot)) $("vRemain").textContent = "预估为 null，余量无法计算";
  else $("vRemain").textContent = "相对单卡 " + hbm + " GiB · 余量 " + fmtG(hbm - tot) + " GiB";
  $("hbmBar").innerHTML = isNum(tot) && tot > 0
    ? parts.map((p) => `<i style="width:${Math.max(0, (isNum(p.g) ? p.g : 0) / tot * 100)}%;background:${p.color}"></i>`).join("")
    : "";

  $("blocks").innerHTML = parts.map((p) =>
    `<div class="blk"><div class="n">${p.name}</div><div class="v">${mem(p.g)}</div><div class="p">${pct(p.g, tot)} of total</div></div>`
  ).join("");

  const chips = [
    `<span class="chip ${r.isMoe ? "warn" : "ok"}">${r.isMoe ? "MOE" : "DENSE"}</span>`,
  ];
  if ((S.model.vitDepth || 0) > 0 || /[-_]?VL[-_]?/i.test(S.modelName)) {
    chips.push(`<span class="chip">VL</span>`);
  }
  if (!r.isMoe && r.denseScheme) {
    chips.push(`<span class="chip ok">${r.denseScheme === "B" ? "按词表高峰" : "按层高峰"}</span>`);
  }
  $("chips").innerHTML = chips.join("");
  setErr((r.warns || []).join("；"));

  const li = (title, fml, val) =>
    `<li><div>${title}<div class="fml">${fml}</div></div><div class="sv">${val}</div></li>`;
  const leaf = (title, fml, val) =>
    `<div class="leaf"><div>${title}<div class="fml">${fml}</div></div><div class="sv">${val}</div></div>`;
  const branch = (title, fml, val, inner, open) =>
    `<details${open ? " open" : ""}><summary><div class="sum"><div class="nm">${title}${fml ? `<div class="fml">${fml}</div>` : ""}</div><div class="sv">${val}</div></div></summary><div class="kids">${inner}</div></details>`;

  const actEq = isNum(r.liveLayers) && isNum(r.samplesFwd) && isNum(r.seq)
    ? `liveLayers × B × S × H × 2 = ${r.liveLayers} × ${r.samplesFwd} × ${r.seq} × ${r.H} × 2 / 1024³ = ${fmtG(r.actG)} GiB`
    : `liveLayers × B × S × H × 2 = ${r.liveLayers} × ${r.samplesFwd == null ? "null" : r.samplesFwd} × ${r.seq == null ? "空" : r.seq} × ${r.H} × 2 = null`;
  const useHead = !r.isMoe && r.denseScheme === "B";
  const dynEq = useHead
    ? `U_head + 2 U_head`
    : `all-gather + copy_out + prefetch + foreach_reduce` + (r.isMoe ? ` + GMM` : ``);
  const headNumel = r.V * r.H;
  let uEq;
  if (useHead) {
    uEq = `U_head = V × H × 2 / 1024³ = ${fmtN(headNumel)} × 2 / 1024³ = ${fmtG(r.uHeadG)} GiB`;
  } else if (!r.wrap && r.E > 0) {
    uEq = `U = (gate_up + down) × 2 / 1024³ = ${fmtN(r.expertNumel)} × 2 / 1024³ = ${fmtG(r.Ufull)} GiB`;
  } else {
    uEq = `U = 一层 numel × 2 / 1024³ = ${fmtN(r.unitNumel)} × 2 / 1024³ = ${fmtG(r.Ufull)} GiB`;
  }
  const wEq = (!isNum(r.N) || !isNum(r.P) || r.P === 0)
    ? `N/P × 2 = ${fmtN(r.N)} / ${r.P == null ? "空" : r.P} × 2 = null`
    : `N/P × 2 = ${fmtN(r.N)} / ${r.P} × 2 = ${fmtN(r.N / r.P * 2)} B = ${fmtG(r.paramG)} GiB`;
  const gEq = (!isNum(r.N) || !isNum(r.P) || r.P === 0)
    ? `N/P × 4 = ${fmtN(r.N)} / ${r.P == null ? "空" : r.P} × 4 = null`
    : `N/P × 4 = ${fmtN(r.N)} / ${r.P} × 4 = ${fmtN(r.N / r.P * 4)} B = ${fmtG(r.gradG)} GiB`;
  const oEq = (!isNum(r.N) || !isNum(r.P) || r.P === 0)
    ? `N/P × 8 = ${fmtN(r.N)} / ${r.P == null ? "空" : r.P} × 8 = null`
    : `N/P × 8 = ${fmtN(r.N)} / ${r.P} × 8 = ${fmtN(r.N / r.P * 8)} B = ${fmtG(r.adamG)} GiB`;
  const hcclEq = !isNum(r.nComm) || !isNum(r.hcclMB)
    ? `n_comm × BUFFSIZE × 2 = ${r.nComm} × ${r.hcclMB == null ? "空" : r.hcclMB} × 2 = null`
    : `n_comm × BUFFSIZE × 2 = ${r.nComm} × ${r.hcclMB} × 2 = ${fmtN(r.nComm * r.hcclMB * 2)} MB = ${fmtG(r.hcclG)} GiB`;

  const vocabN = r.embed + r.lm + r.finalNorm;
  const mlpNormN = r.L * 2 * r.H;
  let mlpKids;
  if (r.E > 0) {
    mlpKids =
      branch("一层 MLP", "gate_up + down + router + shared", fmtN(r.mlpPer),
        leaf("gate_up", `E × H × 2I`, fmtN(r.gateUp)) +
        leaf("down", `E × I × H`, fmtN(r.down)) +
        leaf("router", `E × H`, fmtN(r.router)) +
        leaf("shared", `3 × H × I_share`, fmtN(r.shared)) +
        leaf("shared_gate", `H`, fmtN(r.sharedGate))) +
      leaf("L 层 RMSNorm", `L × 2H`, fmtN(mlpNormN));
  } else if (r.denseI > 0) {
    mlpKids =
      leaf("一层 dense MLP", `3 × H × I`, fmtN(r.denseMlp)) +
      leaf("L 层 RMSNorm", `L × 2H`, fmtN(mlpNormN));
  }
  let attnKids =
    branch("一层 full", "q + k + v + o + q/k_norm", fmtN(r.fullAttn),
      leaf("q", `H × n_q × d${r.attnGate ? " × 2" : ""}`, fmtN(r.fullQ)) +
      leaf("k / v", `H × n_kv × d × 2`, fmtN(r.fullK + r.fullV)) +
      leaf("o", `(n_q × d) × H`, fmtN(r.fullO)) +
      leaf("q/k_norm", `2d`, fmtN(r.fullQkNorm))) +
    leaf(`${r.nFull} 层 full`, `${r.nFull} × ${fmtN(r.fullAttn)}`, fmtN(r.nFull * r.fullAttn));
  if (r.nGdn > 0) {
    attnKids +=
      leaf("一层 GDN", `d_k=${r.dk}，d_v=${r.dv}`, fmtN(r.gdn)) +
      leaf(`${r.nGdn} 层 GDN`, `${r.nGdn} × ${fmtN(r.gdn)}`, fmtN(r.nGdn * r.gdn));
  }
  let textKids =
    branch("词表", "embed + lm_head + RMSNorm", fmtN(vocabN),
      leaf("embed", `V × H`, fmtN(r.embed)) +
      leaf("lm_head", r.tie ? "tie" : `V × H`, fmtN(r.lm)) +
      leaf("最终 RMSNorm", `H`, fmtN(r.finalNorm)));
  if (mlpKids) textKids += branch("L 层 MLP + RMSNorm", `L × (MLP + 2H)`, fmtN(r.mlpLayersN), mlpKids);
  textKids += branch("注意力", `${r.nFull} full + ${r.nGdn} GDN`, fmtN(r.attn), attnKids);
  if (r.mtp > 0) textKids += leaf("MTP", `${r.mtp} 层`, fmtN(r.mtpN));
  let vitKids;
  if (r.vitDepth > 0 && r.freezeVisual) {
    vitKids = leaf("冻结", "不计入 N", "0");
  } else if (r.vitDepth > 0) {
    vitKids =
      leaf("patch embed", `in_ch × t_patch × patch² × H_v + H_v`, fmtN(r.vitPatch)) +
      leaf(`${r.vitDepth} blocks`, `${r.vitDepth} × ${fmtN(r.vitBlock)}`, fmtN(r.vitDepth * r.vitBlock)) +
      leaf("merger + 位置编码", `merger + n_pos × H_v`, fmtN(r.vitMerger));
  }
  const nTree =
    `<div class="tree">` +
    branch("N = Text + ViT", `${fmtN(r.textN)} + ${fmtN(r.vit)}`, fmtN(r.N),
      branch("Text", `词表 + MLP + 注意力`, fmtN(r.textN), textKids) +
      (vitKids
        ? branch("ViT", r.freezeVisual ? "冻结" : "patch + blocks + merger", fmtN(r.vit), vitKids)
        : leaf("ViT", "无视觉塔", "0"))) +
    `</div>`;

  const dynLis = useHead
    ? li("未分片参数", `U_head`, mem(r.uHeadG)) +
      li("foreach_reduce 输入", `2U_head　fp32`, mem(isNum(r.uHeadG) ? 2 * r.uHeadG : null))
    : li("all-gather", `U`, mem(r.agG)) +
      li("copy_out", `U`, mem(r.copyG)) +
      li("prefetch", `prefetch × U　prefetch=${r.prefetch}`, mem(r.prefG)) +
      li("foreach_reduce 输入", `2U　fp32`, mem(r.reduceInG)) +
      (r.isMoe ? li("GMM grad_weight", r.gmmG ? `U` : `未启用`, mem(r.gmmG)) : "");
  const dynKids =
    `<div class="nline">${uEq}</div>` +
    `<div class="tree">` +
    branch("动态模块", "", mem(r.dynG), `<ul class="sub">` + dynLis + `</ul>`) +
    `</div>`;

  $("mapBody").innerHTML = [
    partBlock("权重", COLORS.weight, r.paramG,
      wEq,
      nTree),
    partBlock("优化器", COLORS.adam, r.adamG,
      oEq,
      `<ul class="sub">${li("AdamW", `exp_avg + exp_avg_sq，两份 fp32`, mem(r.adamG))}</ul>`),
    partBlock("梯度", COLORS.grad, r.gradG,
      gEq,
      `<p class="note">reduce-scatter 且 reduce_dtype=fp32 时，各层 reduce 输出是一份 fp32 梯度分片。</p>`),
    partBlock("动态内存", COLORS.dyn, r.dynG,
      dynEq,
      dynKids),
    partBlock("激活值", COLORS.act, r.actG,
      actEq,
      `<ul class="sub">` +
      li("residual", `liveLayers=${r.liveLayers}，B=${r.samplesFwd == null ? "null" : r.samplesFwd}，S=${r.seq == null ? "空" : r.seq}，H=${r.H}`, mem(isNum(r.hiddenG) ? r.hiddenG * r.liveLayers : null)) +
      (r.skipG > 0 ? li("skip_gdn", `offload 关时计入`, mem(r.skipG)) : "") +
      (r.dispatchG > 0 ? li("EP dispatch", `T × topk × H × 2`, mem(r.dispatchG)) : "") +
      `</ul>`),
    partBlock("HCCL", COLORS.hccl, r.hcclG,
      hcclEq,
      ""),
    partBlock("内存碎片", COLORS.frag, r.fragG,
      `1 GiB（预估）`,
      ""),
    partBlock("PTA", COLORS.pta, r.ptaG,
      `1 GiB（预估）`,
      ""),
    partBlock("Device OS", COLORS.os, r.osG,
      `3.5 GiB（预估）`,
      ""),
  ].join("");

  $("mapFoot").textContent = "";
}

function partBlock(name, color, g, eq, inner, right) {
  const shown = right != null ? right : mem(g);
  return `<div class="part"><div class="part-h"><div><b style="background:${color}"></b>${name}</div><div class="g">${shown}</div></div><div class="eq">${eq}</div>${inner}</div>`;
}

function setErr(msg) { $("err").textContent = msg || ""; }

function fillModelSelect() {
  $("ovModel").innerHTML = QWEN_GROUPS.map((g) =>
    `<optgroup label="${g.label}">` +
    g.models.map((name) => `<option value="${name}">${name}</option>`).join("") +
    `</optgroup>`
  ).join("");
  if (!allQwenModels().includes(S.modelName)) S.modelName = "Qwen3.5-27B";
  $("ovModel").value = S.modelName;
}

function configUrls(repo) {
  return [
    `https://modelscope.cn/models/${repo}/resolve/master/config.json`,
    `https://www.modelscope.cn/models/${repo}/resolve/master/config.json`,
    `https://huggingface.co/${repo}/raw/main/config.json`,
  ];
}

async function fetchRemoteConfig(repo) {
  let lastErr;
  for (const url of configUrls(repo)) {
    try {
      const res = await fetch(url, { mode: "cors" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr || new Error("拉取失败");
}

function applyParsedModel(m, resetTrain) {
  if (!m.layerTypes || !m.layerTypes.length) {
    m.layerTypes = defaultLayerTypes(m.layers, m.fullInterval || 4);
  }
  S.model = m;
  if (resetTrain) S.train = (m.experts || 0) > 0 ? defaultTrainMoe() : defaultTrainDense();
  S.train.mtp = 0;
  S.model.mtp = 0;
  writeForm();
  render();
}

let fetchGen = 0;
async function loadWeight(repo, resetTrain) {
  const gen = ++fetchGen;
  S.weightRepo = repo;
  if (repo === "local:20L") {
    setErr("");
    $("cfgHint").textContent = "本地 20 层预置，不从 ModelScope 拉取。";
    applyParsedModel({ ...DEFAULT_35B, layerTypes: defaultLayerTypes(20, 4) }, resetTrain);
    return;
  }
  $("cfgHint").textContent = "正在从 ModelScope 拉取 config.json…";
  setErr("");
  try {
    const cfg = await fetchRemoteConfig(repo);
    if (gen !== fetchGen) return;
    const m = parseConfig(cfg);
    if (!m.hidden || !m.layers) throw new Error("未能读取 hidden_size / num_hidden_layers");
    $("cfgHint").textContent = "权重数据实时从 ModelScope 拉取。MTP 已按训练常用覆盖为 0。";
    applyParsedModel({ ...EMPTY_MODEL, ...m }, resetTrain);
  } catch (e) {
    if (gen !== fetchGen) return;
    $("cfgHint").textContent = "权重数据实时从 ModelScope 拉取。";
    setErr("拉取 " + repo + " 的 config.json 失败：" + (e && e.message ? e.message : e));
  }
}

function onModelPicked() {
  S.modelName = $("ovModel").value;
  $("ovCustomRepo").value = "";
  loadWeight(repoForModel(S.modelName), true);
}

function onCustomRepo() {
  const raw = String($("ovCustomRepo").value || "").trim().replace(/^https?:\/\/(www\.)?modelscope\.cn\/models\//, "").replace(/\/+$/, "");
  if (!raw || !raw.includes("/")) {
    setErr("自定义仓库请写成 owner/name，例如 Qwen/Qwen3.5-9B");
    return;
  }
  const name = raw.split("/")[1];
  if (allQwenModels().includes(name)) {
    S.modelName = name;
    fillModelSelect();
  }
  loadWeight(raw, true);
}

fillModelSelect();
$("ovModel").addEventListener("change", onModelPicked);
$("ovCustomRepo").addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    onCustomRepo();
  }
});
document.querySelectorAll("input, select").forEach((el) => {
  if (el.id === "ovModel" || el.id === "ovCustomRepo") return;
  el.addEventListener("input", () => { readForm(); render(); });
  el.addEventListener("change", () => { readForm(); render(); });
});
loadWeight(repoForModel(S.modelName), true);
</script>
</body>
</html>
